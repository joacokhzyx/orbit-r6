name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Must equal the commit in docs/PIN.md. A pin move edits this line in the
  # same commit as PIN.md.
  ORBIT_PIN: b1b33e06d2b26d1c1bcfebe379038228a12c9957
  # The measured toolchain: w64devkit 2.10.0 ships GCC 16.2.0 (docs/PIN.md).
  W64DEVKIT_URL: https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe
  W64DEVKIT_SHA256: 18d0a4c71a166f8401ab6305781bec5882b40b5e06ba9807c61cb5f3b3c6325e
  R6_MINGW_ROOT: C:/w64devkit
  R6_MINGW_GCC_VERSION: 16.2.0

defaults:
  run:
    shell: pwsh

jobs:
  # Gate on every push and pull request: driver build, reject-case drift,
  # loader suite (acceptance controls link and run, so they need the archive).
  loader:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: joacokhzyx/orbit-lang
          ref: ${{ env.ORBIT_PIN }}
          path: orbit-lang

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install w64devkit
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'w64devkit.7z.exe'
          Invoke-WebRequest -Uri $env:W64DEVKIT_URL -OutFile $exe
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:W64DEVKIT_SHA256) { throw "w64devkit sha256 $got" }
          & $exe -oC:\ -y | Out-Null
          Add-Content $env:GITHUB_PATH 'C:\w64devkit\bin'
          & C:\w64devkit\bin\gcc.exe --version

      - name: Check the pinned checkout
        run: |
          $head = git -C orbit-lang rev-parse HEAD
          if ($head -ne $env:ORBIT_PIN) { throw "orbit-lang at $head, pin is $env:ORBIT_PIN" }
          $manifest = Get-Content tests/corpus/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.emitter.languageCommit -ne $head) { throw "corpus manifest pin is $($manifest.emitter.languageCommit), checked out $head" }

      - name: Build the runtime archive
        run: |
          New-Item -ItemType Directory -Force .r6-build\runtime-win64 | Out-Null
          $out = Join-Path $PWD '.r6-build\runtime-win64\libruntime_net.a'
          python orbit-lang/scripts/mklib_runtime.py --cc C:\w64devkit\bin\gcc.exe --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build-runtime-db.py --orbit-root orbit-lang --cc C:\w64devkit\bin\gcc.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $n = (& C:\w64devkit\bin\nm.exe --defined-only $out | Measure-Object -Line).Lines
          Write-Host "defined symbols: $n"

      - name: CI
        env:
          R6_CC: C:\w64devkit\bin\gcc.exe
        run: ./scripts/ci.ps1

  loader-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: joacokhzyx/orbit-lang
          ref: ${{ env.ORBIT_PIN }}
          path: orbit-lang
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the pinned checkout
        run: |
          test "$(git -C orbit-lang rev-parse HEAD)" = "$ORBIT_PIN"
          test "$(python -c 'import json; print(json.load(open("tests/corpus/manifest.json"))["emitter"]["languageCommit"])')" = "$ORBIT_PIN"
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build R6 and the pinned runtime archives
        run: |
          bash scripts/build-r6.sh
          bash scripts/build-runtime-linux.sh "$PWD/orbit-lang"
      - name: Loader and runtime module gates
        run: |
          python tests/reject/make_cases.py --check
          python tests/reject/run_reject.py
          python tests/runtime-module/make_probe.py --check
          python tests/runtime-module/run_runtime_module.py
      - name: Differential, corpus and self-host gates
        if: github.event_name == 'workflow_dispatch'
        run: |
          orbit_root="$PWD/orbit-lang"
          (cd "$orbit_root" && python scripts/dev.py fp)
          fp=$(cd "$orbit_root" && python scripts/dev.py fp-path)
          python tests/diff/run_diff.py --compiler "$fp" --cc gcc --orbit-root "$orbit_root" \
            --r6-command ./.r6-build/r6 build '{ir}' -o '{exe}'
          python tests/corpus/run_corpus.py --compiler "$fp" --cc gcc --orbit-root "$orbit_root" --check \
            --r6-command ./.r6-build/r6 build '{ir}' -o '{exe}'
          bash scripts/selfhost.sh "$orbit_root" "$fp" "$PWD/.r6-build/r6"
          python tests/http/run_http_client.py --compiler "$fp" --orbit-root "$orbit_root"
          python tests/http/run_http_server.py --compiler "$fp" --orbit-root "$orbit_root"

  # Differential, corpus ratchet and self-host against the Orbit gcc oracle. Building the
  # fixed point takes minutes, so the job runs only on manual dispatch. To run
  # it on every push, delete the `if:` line. It needs the pinned orbit-lang
  # checkout, a GCC for the oracle side and a Python that runs
  # `scripts/dev.py fp` in that checkout.
  oracle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ORBIT_CCACHE: '0'
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: joacokhzyx/orbit-lang
          ref: ${{ env.ORBIT_PIN }}
          path: orbit-lang

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install w64devkit
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'w64devkit.7z.exe'
          Invoke-WebRequest -Uri $env:W64DEVKIT_URL -OutFile $exe
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:W64DEVKIT_SHA256) { throw "w64devkit sha256 $got" }
          & $exe -oC:\ -y | Out-Null
          Add-Content $env:GITHUB_PATH 'C:\w64devkit\bin'

      - name: Build the runtime archive
        run: |
          New-Item -ItemType Directory -Force .r6-build\runtime-win64 | Out-Null
          $out = Join-Path $PWD '.r6-build\runtime-win64\libruntime_net.a'
          python orbit-lang/scripts/mklib_runtime.py --cc C:\w64devkit\bin\gcc.exe --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build-runtime-db.py --orbit-root orbit-lang --cc C:\w64devkit\bin\gcc.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the Orbit fixed point
        working-directory: orbit-lang
        run: |
          python scripts/dev.py fp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fp = python scripts/dev.py fp-path
          Add-Content $env:GITHUB_ENV "ORBIT_FP=$fp"

      - name: CI with differential, corpus and self-host
        env:
          R6_CC: C:\w64devkit\bin\gcc.exe
        run: >
          ./scripts/ci.ps1 -Diff -Corpus -Selfhost
          -Compiler $env:ORBIT_FP
          -OrbitRoot (Join-Path $PWD 'orbit-lang')
          -Cc C:\w64devkit\bin\gcc.exe

      - name: HTTP client parity on loopback
        run: python tests/http/run_http_client.py --compiler $env:ORBIT_FP --orbit-root orbit-lang

      - name: HTTP server parity on loopback
        run: python tests/http/run_http_server.py --compiler $env:ORBIT_FP --orbit-root orbit-lang

  http-benchmark:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/experiment/http-request-memory'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: joacokhzyx/orbit-lang
          ref: ${{ env.ORBIT_PIN }}
          path: orbit-lang
      - uses: actions/checkout@v4
        with:
          repository: joacokhzyx/orbit-lang
          ref: de4ebf52eabae2504d570a473c5e5385816674ed
          path: orbit-c-reference
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - name: Build the five services
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          mkdir -p bench-bin bench-results
          fixture="$PWD/tests/perf/http"
          export ORBIT_WORKERS=2 ORBIT_ADMISSION=0 ORBIT_LOGS=0 ORBIT_CC=gcc
          bash scripts/build-r6.sh
          python orbit-lang/scripts/mklib_runtime.py --cc gcc --out "$PWD/bench-bin/libruntime_net.a"
          (cd orbit-lang && python scripts/dev.py fp)
          fp=$(cd orbit-lang && python scripts/dev.py fp-path)
          (cd orbit-c-reference && "$fp" build "$fixture/service.orb" --backend=c -o "$GITHUB_WORKSPACE/bench-bin/orbit-c")
          export ORBIT_R6="$PWD/.r6-build/r6" ORBIT_R6_RUNTIME="$PWD/bench-bin"
          (cd orbit-lang && R6_HTTP_BODY_VIEWS=0 "$fp" build "$fixture/service.orb" --backend=native -o "$GITHUB_WORKSPACE/bench-bin/r6-owned")
          (cd orbit-lang && R6_HTTP_BODY_VIEWS=1 "$fp" build "$fixture/service.orb" --backend=native -o "$GITHUB_WORKSPACE/bench-bin/r6-view")
          CGO_ENABLED=0 go build -trimpath -o bench-bin/go "$fixture/server.go"
          cargo +1.90.0 build --locked --release --manifest-path "$fixture/rust/Cargo.toml"
          cp "$fixture/rust/target/release/hyper-reference" bench-bin/rust
          cp "$fixture/rust/Cargo.lock" bench-results/Cargo.lock
          printf 'R6 %s\nOrbit %s\nOrbit C %s\n' "$(git rev-parse HEAD)" "$(git -C orbit-lang rev-parse HEAD)" \
            "$(git -C orbit-c-reference rev-parse HEAD)" > bench-results/versions.txt
          { gcc --version; go version; rustc +1.90.0 --version; lscpu; } >> bench-results/versions.txt
      - name: Pick a common request rate and measure all repetitions
        run: |
          set -euo pipefail
          variants=(--server orbit-c bench-bin/orbit-c --server r6-owned bench-bin/r6-owned
                    --server r6-view bench-bin/r6-view --server go bench-bin/go --server rust bench-bin/rust)
          python -u tests/perf/http/run_bench.py "${variants[@]}" --rate 2048 --reps 5 \
            --output bench-results/fixed-rate.jsonl --metadata bench-results/fixed-rate.json
          python -u tests/perf/http/run_bench.py "${variants[@]}" --rate 0 --reps 5 \
            --output bench-results/saturated.jsonl --metadata bench-results/saturated.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-http-benchmark
          path: bench-results/
          if-no-files-found: error
