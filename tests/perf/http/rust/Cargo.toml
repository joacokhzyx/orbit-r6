[package]
name = "hyper-reference"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bytes = "=1.10.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.6.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.11", features = ["tokio"] }
tokio = { version = "=1.44.2", features = ["macros", "net", "rt-multi-thread"] }
